apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-payment
  namespace: smart-healthcare
  labels:
    app: service-payment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-payment
  template:
    metadata:
      labels:
        app: service-payment
    spec:
      containers:
        - name: service-payment
          image: service-payment:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8084
          env:
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: smart-healthcare-secrets
                  key: PAYMENT_DB_URL
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: smart-healthcare-secrets
                  key: PAYMENT_DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smart-healthcare-secrets
                  key: PAYMENT_DB_PASSWORD
            - name: PAYHERE_MERCHANT_ID
              valueFrom:
                secretKeyRef:
                  name: smart-healthcare-secrets
                  key: PAYHERE_MERCHANT_ID
            - name: PAYHERE_MERCHANT_SECRET
              valueFrom:
                secretKeyRef:
                  name: smart-healthcare-secrets
                  key: PAYHERE_MERCHANT_SECRET
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:29092"
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms256m -Xmx512m -XX:+UseG1GC -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8084
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8084
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: service-payment
  namespace: smart-healthcare
  labels:
    app: service-payment
spec:
  selector:
    app: service-payment
  ports:
    - protocol: TCP
      port: 8084
      targetPort: 8084
  type: ClusterIP
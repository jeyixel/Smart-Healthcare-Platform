spring.application.name=service-patient
server.port=8081

# Load local env file when running from either service-patient/ or workspace root.
spring.config.import=optional:file:.env.local[.properties],optional:file:service-patient/.env.local[.properties]

# Separate database configuration for patient microservice.
# For Supabase, set PATIENT_DB_URL, PATIENT_DB_USERNAME and PATIENT_DB_PASSWORD.
spring.datasource.url=jdbc:postgresql://aws-1-ap-southeast-1.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0
spring.datasource.username=postgres.lslpqrytnumegzlmtcnu
spring.datasource.password=@HM3290630int
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.default_schema=patient_schema
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Hikari Protocol
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1


# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:service-patient-group}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.smarthealth.patient.dto,com.smarthealth.admin.dto
spring.kafka.consumer.properties.spring.json.value.default.type=com.smarthealth.patient.dto.PatientEventDto
smarthealth.kafka.topics.patient-events=${PATIENT_EVENTS_TOPIC:patient-events}
smarthealth.kafka.topics.notification-events=${NOTIFICATION_EVENTS_TOPIC:notification-events}
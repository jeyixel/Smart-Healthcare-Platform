apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemedicine-service
  namespace: smart-healthcare
  labels:
    app: telemedicine-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: telemedicine-service
  template:
    metadata:
      labels:
        app: telemedicine-service
    spec:
      containers:
        - name: telemedicine-service
          image: telemedicine-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8085
          envFrom:
            - configMapRef:
                name: telemedicine-config
          env:
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: smart-healthcare-secrets
                  key: TELEMEDICINE_DB_URL
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: smart-healthcare-secrets
                  key: TELEMEDICINE_DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smart-healthcare-secrets
                  key: TELEMEDICINE_DB_PASSWORD
            - name: JAAS_APP_ID
              valueFrom:
                secretKeyRef:
                  name: smart-healthcare-secrets
                  key: JAAS_APP_ID
            - name: JAAS_API_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: smart-healthcare-secrets
                  key: JAAS_API_KEY_ID
            - name: JAAS_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: smart-healthcare-secrets
                  key: JAAS_PRIVATE_KEY
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms256m -Xmx512m -XX:+UseG1GC -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8085
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8085
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
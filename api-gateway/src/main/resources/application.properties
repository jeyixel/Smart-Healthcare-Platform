spring.application.name=api-gateway
server.port=8081

# Patient Service
spring.cloud.gateway.mvc.routes[0].id=patient-service
spring.cloud.gateway.mvc.routes[0].uri=${PATIENT_SERVICE_URL:http://localhost:8081}
spring.cloud.gateway.mvc.routes[0].predicates[0]=Path=/api/v1/patients/**

# Admin Service
spring.cloud.gateway.mvc.routes[1].id=admin-service
spring.cloud.gateway.mvc.routes[1].uri=${ADMIN_SERVICE_URL:http://localhost:8087}
spring.cloud.gateway.mvc.routes[1].predicates[0]=Path=/api/v1/admin/**

# Auth Service
spring.cloud.gateway.mvc.routes[2].id=auth-service
spring.cloud.gateway.mvc.routes[2].uri=${AUTH_SERVICE_URL:http://localhost:8087}
spring.cloud.gateway.mvc.routes[2].predicates[0]=Path=/api/v1/auth/**

# Appointment Service
spring.cloud.gateway.mvc.routes[3].id=appointment-service
spring.cloud.gateway.mvc.routes[3].uri=${APPOINTMENT_SERVICE_URL:http://localhost:8083}
spring.cloud.gateway.mvc.routes[3].predicates[0]=Path=/api/v1/appointments/**

# Doctor Service
spring.cloud.gateway.mvc.routes[4].id=doctor-service
spring.cloud.gateway.mvc.routes[4].uri=${DOCTOR_SERVICE_URL:http://localhost:8082}
spring.cloud.gateway.mvc.routes[4].predicates[0]=Path=/api/v1/doctors/**

# Prescription Service
spring.cloud.gateway.mvc.routes[5].id=prescription-service
spring.cloud.gateway.mvc.routes[5].uri=${PRESCRIPTION_SERVICE_URL:http://localhost:8088}
spring.cloud.gateway.mvc.routes[5].predicates[0]=Path=/api/v1/prescriptions/**


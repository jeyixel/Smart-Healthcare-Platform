spring.application.name=api-gateway
server.port=8080
server.tomcat.max-http-form-post-size=20MB
server.tomcat.max-swallow-size=20MB
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Patient Service
spring.cloud.gateway.server.mvc.routes[0].id=patient-service
spring.cloud.gateway.server.mvc.routes[0].uri=${PATIENT_SERVICE_URL:http://localhost:8081}
spring.cloud.gateway.server.mvc.routes[0].predicates[0]=Path=/api/v1/patients/**
spring.cloud.gateway.server.mvc.routes[0].predicates[1]=Method=GET,POST,PUT,PATCH,DELETE

# Admin Service
spring.cloud.gateway.server.mvc.routes[1].id=admin-service
spring.cloud.gateway.server.mvc.routes[1].uri=${ADMIN_SERVICE_URL:http://localhost:8087}
spring.cloud.gateway.server.mvc.routes[1].predicates[0]=Path=/api/v1/admin/**

# Auth Service
spring.cloud.gateway.server.mvc.routes[2].id=auth-service
spring.cloud.gateway.server.mvc.routes[2].uri=${AUTH_SERVICE_URL:http://localhost:8087}
spring.cloud.gateway.server.mvc.routes[2].predicates[0]=Path=/api/v1/auth/**

# Doctor Service Route
spring.cloud.gateway.server.mvc.routes[3].id=doctor-service
spring.cloud.gateway.server.mvc.routes[3].uri=${DOCTOR_SERVICE_URL:http://localhost:8082}
spring.cloud.gateway.server.mvc.routes[3].predicates[0]=Path=/api/v1/doctors/**

# Appointment Service Route
spring.cloud.gateway.server.mvc.routes[4].id=appointment-service
spring.cloud.gateway.server.mvc.routes[4].uri=${APPOINTMENT_SERVICE_URL:http://localhost:8083}
spring.cloud.gateway.server.mvc.routes[4].predicates[0]=Path=/api/v1/appointments/**


# Prescription Service
spring.cloud.gateway.server.mvc.routes[5].id=prescription-service
spring.cloud.gateway.server.mvc.routes[5].uri=${PRESCRIPTION_SERVICE_URL:http://localhost:8088}
spring.cloud.gateway.server.mvc.routes[5].predicates[0]=Path=/api/v1/prescriptions/**

# Payment Service
spring.cloud.gateway.mvc.routes[6].id=payment-service
spring.cloud.gateway.mvc.routes[6].uri=${PAYMENT_SERVICE_URL:http://localhost:8084}
spring.cloud.gateway.mvc.routes[6].predicates[0]=Path=/api/v1/payments/**

# Telemedicine Service
spring.cloud.gateway.mvc.routes[7].id=telemedicine-service
spring.cloud.gateway.mvc.routes[7].uri=${TELEMEDICINE_SERVICE_URL:http://localhost:8085}
spring.cloud.gateway.mvc.routes[7].predicates[0]=Path=/api/v1/telemedicine/**

# Notification Service
spring.cloud.gateway.mvc.routes[8].id=notification-service
spring.cloud.gateway.mvc.routes[8].uri=${NOTIFICATION_SERVICE_URL:http://localhost:8086}
spring.cloud.gateway.mvc.routes[8].predicates[0]=Path=/api/v1/notifications/**



# CORS (can be overridden via environment variable CORS_ALLOWED_ORIGINS)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Externalizable settings / placeholders (mirror keys from .env)
# API Gateway public URL (helpful for documentation or other services)
api.gateway.url=${API_GATEWAY_URL:http://localhost:8080}

# Patient service base URL (some clients/services reference this)
patient.service.base-url=${PATIENT_SERVICE_BASE_URL:http://localhost:8081}

# Kafka and DB placeholders (optional; empty by default for DB values)
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
db.url=${DB_URL:}
db.user=${DB_USER:}
db.password=${DB_PASSWORD:}

# JWT Security (allow override from env vars APPLICATION_SECURITY_JWT_*)
application.security.jwt.secret-key=${APPLICATION_SECURITY_JWT_SECRET_KEY:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
application.security.jwt.expiration=${APPLICATION_SECURITY_JWT_EXPIRATION:86400000}

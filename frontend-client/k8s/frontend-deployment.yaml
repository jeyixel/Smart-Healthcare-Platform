apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: smart-healthcare
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: frontend-client:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: API_GATEWAY_INTERNAL_URL
              value: "http://api-gateway:8080"
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: smart-healthcare-secrets
                  key: GEMINI_API_KEY
            - name: NEXT_PUBLIC_API_GATEWAY_BASE
              value: "http://localhost:30080"
            - name: NEXT_PUBLIC_API_GATEWAY
              value: "http://localhost:30080"
            - name: NEXT_PUBLIC_API_GATEWAY_URL
              value: "http://localhost:30080"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: smart-healthcare
  labels:
    app: frontend
spec:
  selector:
    app: frontend
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
      nodePort: 30000
  type: NodePort

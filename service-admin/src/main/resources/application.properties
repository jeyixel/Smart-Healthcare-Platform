spring.application.name=service-admin
server.port=8087

# Load local env file when running from either service-admin/ or workspace root.
spring.config.import=optional:file:.env.local[.properties],optional:file:service-admin/.env.local[.properties]

# Dedicated database for admin service.
# For Supabase, set ADMIN_DB_URL, ADMIN_DB_USERNAME and ADMIN_DB_PASSWORD.
spring.datasource.url=jdbc:postgresql://aws-1-ap-southeast-1.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0
spring.datasource.username=postgres.wqjdvfvqmcttvfjhfhnt
spring.datasource.password=CNxPVqz595OQieg5
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=${ADMIN_DB_DDL_AUTO:update}
spring.jpa.show-sql=${ADMIN_DB_SHOW_SQL:false}
spring.jpa.properties.hibernate.default_schema=${ADMIN_DB_SCHEMA:admin_schema}
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Hikari Protocol
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1


# Upstream patient service configuration.
patient.service.base-url=${PATIENT_SERVICE_BASE_URL:http://localhost:8081}
patient.service.endpoints.set-status=${PATIENT_SERVICE_SET_STATUS_ENDPOINT:/api/v1/internal/patients/{patientId}/status}
patient.service.endpoints.upsert-prescription=${PATIENT_SERVICE_UPSERT_PRESCRIPTION_ENDPOINT:/api/v1/internal/prescription-snapshots}
patient.service.endpoints.base=${PATIENT_SERVICE_BASE_ENDPOINT:/api/v1/patients}

# Upstream appointment service configuration.
appointment.service.base-url=${APPOINTMENT_SERVICE_BASE_URL:http://localhost:8083}
appointment.service.endpoints.base=${APPOINTMENT_SERVICE_BASE_ENDPOINT:/api/v1/appointments}

# Upstream payment service configuration.
payment.service.base-url=${PAYMENT_SERVICE_BASE_URL:http://localhost:8084}
payment.service.endpoints.base=${PAYMENT_SERVICE_BASE_ENDPOINT:/api/payments}

# Upstream doctor service configuration.
doctor.service.base-url=${DOCTOR_SERVICE_BASE_URL:http://localhost:8082}
doctor.service.endpoints.base=${DOCTOR_SERVICE_BASE_ENDPOINT:/api/v1/doctors}

# Upstream notification service configuration.
notification.service.url=${NOTIFICATION_SERVICE_URL:http://localhost:8086}

management.endpoints.web.exposure.include=health,info

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
smarthealth.kafka.topics.patient-events=${PATIENT_EVENTS_TOPIC:patient-events}

# JWT Security
application.security.jwt.secret-key=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
# 24 hours in milliseconds
application.security.jwt.expiration=86400000
# 7 days in milliseconds
application.security.jwt.refresh-token.expiration=604800000

# Forgot password OTP + SMTP
app.security.otp.expiration-minutes=${OTP_EXPIRATION_MINUTES:10}
app.mail.from=${MAIL_FROM:no-reply@smarthealth.local}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}

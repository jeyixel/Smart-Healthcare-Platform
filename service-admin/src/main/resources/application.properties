# Hikari Protocol
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.data-source-properties.prepareThreshold=0
spring.datasource.hikari.data-source-properties.preferQueryMode=simple


# Upstream patient service configuration.
patient.service.base-url=http://localhost:8081
patient.service.endpoints.set-status=/api/v1/internal/patients/{patientId}/status
patient.service.endpoints.upsert-prescription=/api/v1/internal/prescription-snapshots
patient.service.endpoints.base=/api/v1/patients

# Upstream appointment service configuration.
appointment.service.base-url=http://localhost:8083
appointment.service.endpoints.base=/api/v1/appointments

# Upstream payment service configuration.
payment.service.base-url=http://localhost:8084
payment.service.endpoints.base=/api/payments

# Upstream doctor service configuration.
doctor.service.base-url=${DOCTOR_SERVICE_BASE_URL:http://localhost:8082}
doctor.service.endpoints.base=${DOCTOR_SERVICE_BASE_ENDPOINT:/api/v1/doctors}

# Upstream notification service configuration.
notification.service.url=${NOTIFICATION_SERVICE_URL:http://localhost:8086}

management.endpoints.web.exposure.include=health,info

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
smarthealth.kafka.topics.patient-events=${PATIENT_EVENTS_TOPIC:patient-events}


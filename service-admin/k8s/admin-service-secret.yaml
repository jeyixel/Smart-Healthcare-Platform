apiVersion: v1
kind: Secret
metadata:
  name: admin-service-secret
  namespace: smart-healthcare
  labels:
    app: admin-service
type: Opaque
stringData:
  # Admin Database - using Kubernetes in-cluster postgres service
  # patient-postgres service is available within the cluster
  ADMIN_DB_URL: "jdbc:postgresql://patient-postgres:5432/admin_db"
  ADMIN_DB_USERNAME: "postgres"
  ADMIN_DB_PASSWORD: "postgres"
  
  # JWT & Security
  JWT_SECRET_KEY: "404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970"
  
  # Email/SMTP
  MAIL_USERNAME: "your-email@gmail.com"
  MAIL_PASSWORD: "your-app-password"

apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-service
  namespace: smart-healthcare
  labels:
    app: admin-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: admin-service
  template:
    metadata:
      labels:
        app: admin-service
    spec:
      containers:
        - name: admin-service
          image: admin-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8087
          envFrom:
            - configMapRef:
                name: admin-service-config
          env:
            - name: ADMIN_DB_URL
              valueFrom:
                secretKeyRef:
                  name: smart-healthcare-secrets
                  key: ADMIN_DB_URL
            - name: ADMIN_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: smart-healthcare-secrets
                  key: ADMIN_DB_USERNAME
            - name: ADMIN_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smart-healthcare-secrets
                  key: ADMIN_DB_PASSWORD
            - name: APPLICATION_SECURITY_JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: smart-healthcare-secrets
                  key: APPLICATION_SECURITY_JWT_SECRET_KEY
            - name: APPLICATION_SECURITY_JWT_EXPIRATION
              valueFrom:
                secretKeyRef:
                  name: smart-healthcare-secrets
                  key: APPLICATION_SECURITY_JWT_EXPIRATION
            - name: APPLICATION_SECURITY_JWT_REFRESH_EXPIRATION
              valueFrom:
                secretKeyRef:
                  name: smart-healthcare-secrets
                  key: APPLICATION_SECURITY_JWT_REFRESH_EXPIRATION
            - name: MAIL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: smart-healthcare-secrets
                  key: MAIL_USERNAME
            - name: MAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smart-healthcare-secrets
                  key: MAIL_PASSWORD
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms256m -Xmx512m -XX:+UseG1GC -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8087
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8087
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

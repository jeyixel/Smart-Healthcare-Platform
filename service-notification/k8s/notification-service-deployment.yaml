apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: smart-healthcare
  labels:
    app: notification-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: notification-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8086
          env:
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: smart-healthcare-secrets
                  key: NOTIFICATION_DB_URL
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: smart-healthcare-secrets
                  key: NOTIFICATION_DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smart-healthcare-secrets
                  key: NOTIFICATION_DB_PASSWORD
            - name: MAIL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: smart-healthcare-secrets
                  key: NOTIFICATION_MAIL_USERNAME
            - name: MAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smart-healthcare-secrets
                  key: NOTIFICATION_MAIL_PASSWORD
            - name: NOTIFY_USER_ID
              valueFrom:
                secretKeyRef:
                  name: smart-healthcare-secrets
                  key: NOTIFY_USER_ID
            - name: NOTIFY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: smart-healthcare-secrets
                  key: NOTIFY_API_KEY
            - name: NOTIFY_SENDER_ID
              valueFrom:
                secretKeyRef:
                  name: smart-healthcare-secrets
                  key: NOTIFY_SENDER_ID
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:29092"
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: smart-healthcare-secrets
                  key: JWT_SECRET_KEY
            - name: JWT_EXPIRATION
              valueFrom:
                secretKeyRef:
                  name: smart-healthcare-secrets
                  key: JWT_EXPIRATION
            - name: JWT_REFRESH_EXPIRATION
              valueFrom:
                secretKeyRef:
                  name: smart-healthcare-secrets
                  key: JWT_REFRESH_EXPIRATION
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms256m -Xmx512m -XX:+UseG1GC -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8086
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8086
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: smart-healthcare
  labels:
    app: notification-service
spec:
  selector:
    app: notification-service
  ports:
    - protocol: TCP
      port: 8086
      targetPort: 8086
  type: ClusterIP

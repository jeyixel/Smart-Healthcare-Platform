apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-appointment
  labels:
    app: service-appointment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-appointment
  template:
    metadata:
      labels:
        app: service-appointment
    spec:
      containers:
        - name: service-appointment
          image: service-appointment:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8083
          envFrom:
            - configMapRef:
                name: service-appointment-config
          env:
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: appoinment-database-secret
                  key: DB_URL
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: appoinment-database-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: appoinment-database-secret
                  key: DB_PASSWORD
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

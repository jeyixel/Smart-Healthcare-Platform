spring.application.name=service-appointment
server.port=8083

# Load local env file
spring.config.import=optional:file:.env.local[.properties],optional:file:service-appointment/.env.local[.properties]

spring.datasource.url= ${APPOINTMENT_DB_URL}
spring.datasource.username=${APPOINTMENT_DB_USERNAME}
spring.datasource.password=${APPOINTMENT_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.default_schema=appointment_service
spring.jpa.show-sql=true
management.endpoints.web.exposure.include=health,info
logging.level.org.hibernate.SQL=info
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Hikari Protocol
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1


# JWT Security
application.security.jwt.secret-key=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
# 24 hours in milliseconds
application.security.jwt.expiration=86400000
# 7 days in milliseconds
application.security.jwt.refresh-token.expiration=604800000

# Service URLs (override via .env.local)
service.patient.url=${PATIENT_SERVICE_URL:http://localhost:8081/api/v1/patients}
service.doctor.url=${DOCTOR_SERVICE_URL:http://localhost:8082/api/v1/doctors}

# WebClient timeout settings
spring.webflux.webclient.max-in-memory-size=10MB

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

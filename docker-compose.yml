services:
  # ── Redpanda Kafka ────────────────────────────────────────────
  kafka:
    image: redpandadata/redpanda:latest
    container_name: smart-healthcare-kafka
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 1G
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:29092
      - --advertise-kafka-addr
      - PLAINTEXT://kafka:29092
    ports:
      - "29092:29092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster info --brokers=localhost:29092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"

  # ── API Gateway ───────────────────────────────────────────────
  api-gateway:
    build:
      context: ./api-gateway
    image: api-gateway:latest
    ports:
      - "8080:8080"
    environment:
      API_GATEWAY_URL: http://api-gateway:8080
      PATIENT_SERVICE_URL: http://patient-service:8081
      PATIENT_SERVICE_BASE_URL: http://patient-service:8081
      ADMIN_SERVICE_URL: http://admin-service:8087
      AUTH_SERVICE_URL: http://admin-service:8087
      DOCTOR_SERVICE_URL: http://service-doctor:8082
      APPOINTMENT_SERVICE_URL: http://service-appointment:8083
      PAYMENT_SERVICE_URL: http://service-payment:8084
      TELEMEDICINE_SERVICE_URL: http://telemedicine-service:8085
      NOTIFICATION_SERVICE_URL: http://notification-service:8086
      PRESCRIPTION_SERVICE_URL: http://service-prescription:8088
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      APPLICATION_SECURITY_JWT_SECRET_KEY: ${APPLICATION_SECURITY_JWT_SECRET_KEY}
      APPLICATION_SECURITY_JWT_EXPIRATION: ${APPLICATION_SECURITY_JWT_EXPIRATION}
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8080'"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.50"

  # ── Patient Service ───────────────────────────────────────────
  patient-service:
    build:
      context: ./service-patient
    image: patient-service:latest
    ports:
      - "8081:8081"
    environment:
      PATIENT_DB_URL: ${PATIENT_DB_URL}
      PATIENT_DB_USERNAME: ${PATIENT_DB_USERNAME}
      PATIENT_DB_PASSWORD: ${PATIENT_DB_PASSWORD}
      PATIENT_DB_DDL_AUTO: ${PATIENT_DB_DDL_AUTO}
      PATIENT_DB_SHOW_SQL: ${PATIENT_DB_SHOW_SQL}
      PATIENT_DB_SCHEMA: ${PATIENT_DB_SCHEMA}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      PATIENT_EVENTS_TOPIC: ${PATIENT_EVENTS_TOPIC}
      NOTIFICATION_EVENTS_TOPIC: ${NOTIFICATION_EVENTS_TOPIC}
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8081'"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.50"

  # ── Admin Service ─────────────────────────────────────────────
  admin-service:
    build:
      context: ./service-admin
    image: admin-service:latest
    ports:
      - "8087:8087"
    environment:
      ADMIN_DB_URL: ${ADMIN_DB_URL}
      ADMIN_DB_USERNAME: ${ADMIN_DB_USERNAME}
      ADMIN_DB_PASSWORD: ${ADMIN_DB_PASSWORD}
      ADMIN_DB_DDL_AUTO: ${ADMIN_DB_DDL_AUTO}
      ADMIN_DB_SHOW_SQL: ${ADMIN_DB_SHOW_SQL}
      ADMIN_DB_SCHEMA: ${ADMIN_DB_SCHEMA}
      PATIENT_SERVICE_BASE_URL: http://patient-service:8081
      PATIENT_SERVICE_SET_STATUS_ENDPOINT: /api/v1/internal/patients/{patientId}/status
      PATIENT_SERVICE_UPSERT_PRESCRIPTION_ENDPOINT: /api/v1/internal/prescription-snapshots
      APPOINTMENT_SERVICE_BASE_URL: http://service-appointment:8083
      PAYMENT_SERVICE_BASE_URL: http://service-payment:8084
      DOCTOR_SERVICE_BASE_URL: http://service-doctor:8082
      NOTIFICATION_SERVICE_URL: http://notification-service:8086
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      PATIENT_EVENTS_TOPIC: ${PATIENT_EVENTS_TOPIC}
      APPLICATION_SECURITY_JWT_SECRET_KEY: ${APPLICATION_SECURITY_JWT_SECRET_KEY}
      APPLICATION_SECURITY_JWT_EXPIRATION: ${APPLICATION_SECURITY_JWT_EXPIRATION}
      APPLICATION_SECURITY_JWT_REFRESH_EXPIRATION: ${APPLICATION_SECURITY_JWT_REFRESH_EXPIRATION}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS}
      OTP_EXPIRATION_MINUTES: ${OTP_EXPIRATION_MINUTES}
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8087'"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.50"

  # ── Doctor Service ────────────────────────────────────────────
  service-doctor:
    build:
      context: ./service-doctor
    image: service-doctor:latest
    ports:
      - "8082:8082"
    environment:
      DOCTOR_DB_URL: ${DOCTOR_DB_URL}
      DOCTOR_DB_USERNAME: ${DOCTOR_DB_USERNAME}
      DOCTOR_DB_PASSWORD: ${DOCTOR_DB_PASSWORD}
      APPLICATION_SECURITY_JWT_SECRET_KEY: ${APPLICATION_SECURITY_JWT_SECRET_KEY}
      APPLICATION_SECURITY_JWT_EXPIRATION: ${APPLICATION_SECURITY_JWT_EXPIRATION}
      APPLICATION_SECURITY_JWT_REFRESH_EXPIRATION: ${APPLICATION_SECURITY_JWT_REFRESH_EXPIRATION}
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8082'"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.50"

  # ── Appointment Service ───────────────────────────────────────
  service-appointment:
    build:
      context: ./service-appointment
    image: service-appointment:latest
    ports:
      - "8083:8083"
    environment:
      APPOINTMENT_DB_URL: ${APPOINTMENT_DB_URL}
      APPOINTMENT_DB_USERNAME: ${APPOINTMENT_DB_USERNAME}
      APPOINTMENT_DB_PASSWORD: ${APPOINTMENT_DB_PASSWORD}
      PATIENT_SERVICE_URL: http://patient-service:8081/api/v1/patients
      DOCTOR_SERVICE_URL: http://service-doctor:8082/api/v1/doctors
      TELEMEDICINE_SERVICE_URL: http://telemedicine-service:8085/api/v1/telemedicine/sessions
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      APPLICATION_SECURITY_JWT_SECRET_KEY: ${APPLICATION_SECURITY_JWT_SECRET_KEY}
      APPLICATION_SECURITY_JWT_EXPIRATION: ${APPLICATION_SECURITY_JWT_EXPIRATION}
      APPLICATION_SECURITY_JWT_REFRESH_EXPIRATION: ${APPLICATION_SECURITY_JWT_REFRESH_EXPIRATION}
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8083'"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.50"

  # ── Payment Service ───────────────────────────────────────────
  service-payment:
    build:
      context: ./service-payment
    image: service-payment:latest
    ports:
      - "8084:8084"
    environment:
      DB_URL: ${PAYMENT_DB_URL}
      DB_USER: ${PAYMENT_DB_USER}
      DB_PASSWORD: ${PAYMENT_DB_PASSWORD}
      PAYHERE_MERCHANT_ID: ${PAYHERE_MERCHANT_ID}
      PAYHERE_MERCHANT_SECRET: ${PAYHERE_MERCHANT_SECRET}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8084'"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.50"

  # ── Prescription Service ──────────────────────────────────────
  service-prescription:
    build:
      context: ./service-prescription
    image: service-prescription:latest
    ports:
      - "8088:8088"
    environment:
      PRESCRIPTION_DB_URL: ${PRESCRIPTION_DB_URL}
      PRESCRIPTION_DB_USERNAME: ${PRESCRIPTION_DB_USERNAME}
      PRESCRIPTION_DB_PASSWORD: ${PRESCRIPTION_DB_PASSWORD}
      SERVICE_DOCTOR_URL: http://service-doctor:8082/api/v1/doctors
      SERVICE_APPOINTMENT_URL: http://service-appointment:8083/api/v1/appointments
      SERVICE_PATIENT_URL: http://patient-service:8081/api/v1/patients
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      APPLICATION_SECURITY_JWT_SECRET_KEY: ${APPLICATION_SECURITY_JWT_SECRET_KEY}
      APPLICATION_SECURITY_JWT_EXPIRATION: ${APPLICATION_SECURITY_JWT_EXPIRATION}
      APPLICATION_SECURITY_JWT_REFRESH_EXPIRATION: ${APPLICATION_SECURITY_JWT_REFRESH_EXPIRATION}
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8088'"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.50"

  # ── Notification Service ──────────────────────────────────────
  notification-service:
    build:
      context: ./service-notification
    image: notification-service:latest
    ports:
      - "8086:8086"
    environment:
      DB_URL: ${NOTIFICATION_DB_URL}
      DB_USER: ${NOTIFICATION_DB_USER}
      DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
      MAIL_USERNAME: ${NOTIFICATION_MAIL_USERNAME}
      MAIL_PASSWORD: ${NOTIFICATION_MAIL_PASSWORD}
      NOTIFY_USER_ID: ${NOTIFY_USER_ID}
      NOTIFY_API_KEY: ${NOTIFY_API_KEY}
      NOTIFY_SENDER_ID: ${NOTIFY_SENDER_ID}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION}
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8086'"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.50"

  # ── Telemedicine Service ──────────────────────────────────────

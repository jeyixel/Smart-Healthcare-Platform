  # ── Frontend (Next.js) ────────────────────────────────────────
  frontend:
    build:
      context: ./frontend-client
      args:
        NEXT_PUBLIC_API_GATEWAY_BASE: http://localhost:8080
        NEXT_PUBLIC_API_GATEWAY: http://localhost:8080
        NEXT_PUBLIC_API_GATEWAY_URL: http://localhost:8080
        NEXT_PUBLIC_ADMIN_API_BASE: http://localhost:8087
        NEXT_PUBLIC_PATIENT_API_BASE: http://localhost:8081
    image: frontend-client:latest
    ports:
      - "3000:3000"
    environment:
      API_GATEWAY_INTERNAL_URL: http://api-gateway:8080
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      NEXT_PUBLIC_API_GATEWAY_BASE: http://localhost:8080
      NEXT_PUBLIC_API_GATEWAY: http://localhost:8080
      NEXT_PUBLIC_API_GATEWAY_URL: http://localhost:8080
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.50"

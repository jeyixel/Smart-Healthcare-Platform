apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: smart-healthcare
  name: service-prescription
  labels:
    app: service-prescription
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-prescription
  template:
    metadata:
      labels:
        app: service-prescription
    spec:
      containers:
        - name: service-prescription
          image: service-prescription:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8088
          envFrom:
            - configMapRef:
                name: service-prescription-config
          env:
            - name: PRESCRIPTION_DB_URL
              valueFrom:
                secretKeyRef:
                  name: smart-healthcare-secrets
                  key: PRESCRIPTION_DB_URL
            - name: PRESCRIPTION_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: smart-healthcare-secrets
                  key: PRESCRIPTION_DB_USERNAME
            - name: PRESCRIPTION_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smart-healthcare-secrets
                  key: PRESCRIPTION_DB_PASSWORD
            - name: APPLICATION_SECURITY_JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: smart-healthcare-secrets
                  key: APPLICATION_SECURITY_JWT_SECRET_KEY
            - name: APPLICATION_SECURITY_JWT_EXPIRATION
              valueFrom:
                secretKeyRef:
                  name: smart-healthcare-secrets
                  key: APPLICATION_SECURITY_JWT_EXPIRATION
            - name: APPLICATION_SECURITY_JWT_REFRESH_EXPIRATION
              valueFrom:
                secretKeyRef:
                  name: smart-healthcare-secrets
                  key: APPLICATION_SECURITY_JWT_REFRESH_EXPIRATION
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms256m -Xmx512m -XX:+UseG1GC -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8088
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8088
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

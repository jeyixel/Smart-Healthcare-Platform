apiVersion: v1
kind: Secret
metadata:
  namespace: smart-healthcare
  name: prescription-database-secret
  labels: 
    app: service-prescription
type: Opaque
stringData:
  # Replace these with your actual Supabase PostgreSQL connection details
  # e.g. jdbc:postgresql://aws-0-eu-central-1.pooler.supabase.com:6543/postgres
  DB_URL: "jdbc:postgresql://<SUPABASE_HOST>:<PORT>/<DATABASE_NAME>"
  DB_USER: "<SUPABASE_USER>"
  DB_PASSWORD: "<SUPABASE_PASSWORD>"

apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: smart-healthcare
  name: service-doctor
  labels:
    app: service-doctor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-doctor
  template:
    metadata:
      labels:
        app: service-doctor
    spec:
      containers:
        - name: service-doctor
          image: service-doctor:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef:
                name: service-doctor-config
          env:
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: database-secret
                  key: DB_URL
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: database-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: database-secret
                  key: DB_PASSWORD
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

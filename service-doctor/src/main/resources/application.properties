spring.application.name=service-doctor
server.port=8082

# Load local env file
spring.config.import=optional:file:.env.local[.properties],optional:file:service-doctor/.env.local[.properties]

spring.datasource.url=${DOCTOR_DB_URL}
spring.datasource.username=${DOCTOR_DB_USERNAME}
spring.datasource.password=${DOCTOR_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=${DOCTOR_DB_DDL_AUTO:update}
spring.jpa.properties.hibernate.default_schema=${DOCTOR_DB_SCHEMA:doctor_service}
spring.jpa.show-sql=${DOCTOR_DB_SHOW_SQL:true}
management.endpoints.web.exposure.include=health,info
logging.level.org.hibernate.SQL=info
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true

# Hikari Protocol
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JWT Security
application.security.jwt.secret-key=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
# 24 hours in milliseconds
application.security.jwt.expiration=86400000
# 7 days in milliseconds
application.security.jwt.refresh-token.expiration=604800000

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

server.error.include-message=always
server.error.include-exception=true
server.error.include-stacktrace=always

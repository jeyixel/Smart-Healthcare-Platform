apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: smart-healthcare
  labels:
    app: kafka
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
        - name: redpanda
          image: redpandadata/redpanda:latest
          args:
            - redpanda
            - start
            - --overprovisioned
            - --smp
            - "1"
            - --memory
            - 1G
            - --reserve-memory
            - 0M
            - --node-id
            - "0"
            - --kafka-addr
            - PLAINTEXT://0.0.0.0:29092
            - --advertise-kafka-addr
            - PLAINTEXT://kafka:29092
          ports:
            - containerPort: 29092
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            exec:
              command: ["rpk", "cluster", "info", "--brokers=localhost:29092"]
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: smart-healthcare
spec:
  selector:
    app: kafka
  ports:
    - protocol: TCP
      port: 29092
      targetPort: 29092
  type: ClusterIP
